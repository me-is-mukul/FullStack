{% extends "base.html" %}

{% block title %}Change password - QuestForge{% endblock %}

{% block content %}
<div class="narrow-box">
  <div class="card">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Change password</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" with form=form %}
        <button class="btn btn-primary" type="submit">Change password</button>
        <a class="btn btn-light" href="{% url 'profile' %}">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
