{% extends "base.html" %}

{% block title %}Log in - QuestForge{% endblock %}

{% block content %}
<div class="narrow-box">
  <div class="card">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Log in</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" with form=form %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
    </div>
  </div>
  <p class="text-center text-muted mt-3">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
